<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check URL | PhishDetect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>🔎 Check a Website URL</h2>
    <form method="POST">
      <input type="url" name="url" placeholder="Enter a website URL..." required><br>
      <button type="submit">Check URL</button>
    </form>

    {% if prediction %}
      <div class="result-box {% if color == 'red' %}result-phish{% else %}result-safe{% endif %}">
        {{ prediction }}
      </div>
    {% endif %}

    <p style="margin-top:20px;">
      <a href="/dashboard">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>
